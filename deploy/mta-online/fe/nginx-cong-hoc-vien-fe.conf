# Map FE cong-hoc-vien — khớp docker-compose FE thực tế
#
#   mta-cong-hoc-vien-cdn     → host 6009 → container :80
#   router-cong-hoc-vien-api  → host 5188 → container :5182
#
# Cài:
#   sudo cp nginx-cong-hoc-vien-fe.conf /etc/nginx/snippets/cong-hoc-vien-fe.conf
# Trong server 443 (mta.edu.vn) và/hoặc server 80 (IP), TRƯỚC location / :
#   include /etc/nginx/snippets/cong-hoc-vien-fe.conf;
#   include /etc/nginx/snippets/mta-be-apis.conf;   # nếu chưa include API BE
#
#   sudo nginx -t && sudo systemctl reload nginx

# Static assets: NEXT_PUBLIC_ASSET_PREFIX=/cong-hoc-vien/cdn
location /cong-hoc-vien/cdn/ {
    proxy_pass http://127.0.0.1:6009/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    add_header Cache-Control "public, max-age=31536000, immutable";
}

# App HTML / pages: NEXT_PUBLIC_BASE_PATH=/cong-hoc-vien
location /cong-hoc-vien/ {
    proxy_pass http://127.0.0.1:6009/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Router .NET (BFF) — path tùy Configs của router; phổ biến /cong-hoc-vien/api/
# Nếu router listen root /api/ thì đổi proxy_pass cho khớp appsettings
location /cong-hoc-vien/api/ {
    proxy_pass http://127.0.0.1:5188/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
    client_max_body_size 512m;
}
