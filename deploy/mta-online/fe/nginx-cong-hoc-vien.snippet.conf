# Thêm vào /etc/nginx/sites-available/prod_mta_portal
# (trong server { listen 443; server_name mta.edu.vn; } — TRƯỚC location / )
#
# Hoặc include:
#   include /etc/nginx/snippets/cong-hoc-vien.conf;
#
# Upstream thực tế (docker-compose FE):
#   cong-hoc-vien-cdn  → 127.0.0.1:6009
#   router API         → 127.0.0.1:5188
#   be-portal          → 127.0.0.1:3044
#   be-model           → 127.0.0.1:3041
#   be-ql-dao-tao      → 127.0.0.1:3042
#
# Xem file đầy đủ FE: nginx-cong-hoc-vien-fe.conf
# FE build: BASE_PATH=/cong-hoc-vien  ASSET_PREFIX=/cong-hoc-vien/cdn
#           FE_APP_URL=https://mta.edu.vn

# Static CDN
location /cong-hoc-vien/cdn/ {
    proxy_pass http://127.0.0.1:6009/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    add_header Cache-Control "public, max-age=31536000, immutable";
}

# App pages
location /cong-hoc-vien/ {
    proxy_pass http://127.0.0.1:6009/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location /cong-hoc-vien/api/ {
    proxy_pass http://127.0.0.1:5188/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 512m;
}

# API portal (đăng ký học)
location /api/portal/ {
    proxy_pass http://127.0.0.1:3044/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 512m;
}

# API model (nếu FE gọi)
location /api/model/ {
    proxy_pass http://127.0.0.1:3041/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 512m;
}

# API LMS / ql-dao-tao (nếu FE gọi)
location /api/lms/ {
    proxy_pass http://127.0.0.1:3042/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 512m;
}
