# Map nginx → BE đã deploy trên mta_online
# Ports (host): model 3041 | ql-dao-tao 3042 | portal 3044 | shared 3045 | minio 9000
#
# Cài đặt:
#   sudo cp nginx-mta-be-apis.conf /etc/nginx/snippets/mta-be-apis.conf
#
# Trong server 443 (prod_mta_portal) và/hoặc server 80 IP (mta_portal),
# THÊM TRƯỚC location / :
#   include /etc/nginx/snippets/mta-be-apis.conf;
#
#   sudo nginx -t && sudo systemctl reload nginx

# ── be-portal (:3044, optional scale :3046) ───────────────
# Scale 2 instance:
#   docker compose -f docker-compose.yml -f docker-compose.portal-scale.yml up -d
# rồi bỏ comment server 3046 bên dưới + reload nginx.
upstream mta_be_portal {
    least_conn;
    server 127.0.0.1:3044;
    # server 127.0.0.1:3046;
    keepalive 32;
}

location /api/portal/ {
    proxy_pass http://mta_be_portal/api/;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
    proxy_connect_timeout 10s;
    client_max_body_size 512m;
}

# ── be-model :3041 ───────────────────────────────────────
location /api/model/ {
    proxy_pass http://127.0.0.1:3041/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
    client_max_body_size 512m;
}

# ── be-khao-thi :3043 ────────────────────────────────────
location /api/ems/ {
    proxy_pass http://127.0.0.1:3043/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
    client_max_body_size 512m;
}

# mta_online FE build uses /cong-sinh-vien as the API mount prefix.
location /cong-sinh-vien/api/ems/ {
    proxy_pass http://127.0.0.1:3043/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
    client_max_body_size 512m;
}

# ── be-ql-dao-tao :3042 (LMS) ────────────────────────────
location /api/lms/ {
    proxy_pass http://127.0.0.1:3042/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
    client_max_body_size 512m;
}

# ── be-ql-dao-tao-shared :3045 ───────────────────────────
location /api/lms-shared/ {
    proxy_pass http://127.0.0.1:3045/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
    client_max_body_size 512m;
}

# Alias nếu FE/shared dùng /api/shared/
location /api/shared/ {
    proxy_pass http://127.0.0.1:3045/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
    client_max_body_size 512m;
}

# ── MinIO API (tùy chọn; hoặc để public :9000) ───────────
location /minio/ {
    proxy_pass http://127.0.0.1:9000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 2g;
    proxy_buffering off;
    proxy_request_buffering off;
}
