# Dùng khi test qua IP http://27.71.20.109 (file mta_portal)
# Thêm vào server { listen 80; server_name 27.71.20.109; }
# TRƯỚC location / { proxy_pass 8081; }

location /cong-hoc-vien/cdn/ {
    proxy_pass http://127.0.0.1:3081/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location /cong-hoc-vien/ {
    proxy_pass http://127.0.0.1:3081/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location /api/portal/ {
    proxy_pass http://127.0.0.1:3044/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 512m;
}

location /api/model/ {
    proxy_pass http://127.0.0.1:3041/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 512m;
}
