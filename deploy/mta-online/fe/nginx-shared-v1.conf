# Edge security cho API tích hợp đối tác — be-ql-dao-tao-shared /v1
#
# Cài đặt (mta_online):
#   1. sudo cp deploy/mta-online/fe/nginx-shared-v1.conf /etc/nginx/snippets/mta-shared-v1.conf
#   2. Trong http {}: include snippet rate-limit zone (hoặc copy block limit_req_zone vào http)
#   3. Trong server 443: include /etc/nginx/snippets/mta-shared-v1.conf;
#   4. Điền IP whitelist thật của đối tác
#   5. sudo nginx -t && sudo systemctl reload nginx
#
# SSL/HTTPS: dùng server block 443 sẵn có (prod_mta_portal).
# HTTP → HTTPS: giữ return 301 trong server :80.

# Đặt trong context http { } (một lần):
# limit_req_zone $binary_remote_addr zone=shared_v1_limit:10m rate=100r/m;

# ── Partner REST /api/shared/v1/* → shared :3045/v1/* ──
# Access log riêng (IP + Host + UA + request):
#   sudo mkdir -p /var/log/nginx
#   tail -f /var/log/nginx/mta-shared-v1.access.log
location /api/shared/v1/ {
    # IP Whitelist — THAY bằng dải IP đối tác
    # allow 203.0.113.10;
    # allow 203.0.113.0/24;
    # deny all;

    # Rate limit 100 req/phút/IP → 429
    limit_req zone=shared_v1_limit burst=20 nodelay;
    limit_req_status 429;

    # WAF (nếu đã cài ModSecurity):
    # modsecurity on;
    # modsecurity_rules_file /etc/nginx/modsec/main.conf;

    access_log /var/log/nginx/mta-shared-v1.access.log combined;

    proxy_pass http://127.0.0.1:3045/v1/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;
    proxy_read_timeout 60s;
    client_max_body_size 1m;
}
