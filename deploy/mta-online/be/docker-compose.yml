name: mta-be-infra

services:
  postgres:
    image: postgres:17
    container_name: postgres
    hostname: postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-root}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-mta}
      TZ: Asia/Ho_Chi_Minh
    # Chịu tải đợt ĐK ~500 SV: pool các BE + connection admin
    command:
      - postgres
      - -c
      - max_connections=${POSTGRES_MAX_CONNECTIONS:-300}
      - -c
      - shared_buffers=${POSTGRES_SHARED_BUFFERS:-256MB}
      - -c
      - effective_cache_size=${POSTGRES_EFFECTIVE_CACHE_SIZE:-1GB}
      - -c
      - work_mem=${POSTGRES_WORK_MEM:-8MB}
      - -c
      - idle_in_transaction_session_timeout=60000
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-root} -d ${POSTGRES_DB:-mta}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - mta-net

  minio:
    image: minio/minio:latest
    container_name: minio
    hostname: minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    env_file:
      - .env
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - mta-net

  redis:
    image: redis:7-alpine
    container_name: redis
    hostname: redis
    restart: unless-stopped
    environment:
      TZ: Asia/Ho_Chi_Minh
    command:
      - redis-server
      - --maxmemory
      - ${REDIS_MAXMEMORY:-256mb}
      - --maxmemory-policy
      - allkeys-lru
      - --save
      - ""
      - --appendonly
      - "no"
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - mta-net

  # Image: make all-be-* → docker load ghcr.io/songphantech/mta-be-*:latest
  mta-be-model:
    image: ghcr.io/songphantech/mta-be-model:latest
    pull_policy: never
    container_name: mta-be-model
    restart: unless-stopped
    env_file:
      - .env
      - .env.be-model
    environment:
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "3041:3000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - mta-net

  mta-be-khao-thi:
    image: ghcr.io/songphantech/mta-be-khao-thi:latest
    pull_policy: never
    container_name: mta-be-khao-thi
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "3043:3000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - mta-net

  mta-be-ql-dao-tao:
    image: ghcr.io/songphantech/mta-be-ql-dao-tao:latest
    pull_policy: never
    container_name: mta-be-ql-dao-tao
    restart: unless-stopped
    env_file:
      - .env
    environment:
      EXPORT_OUTPUT_DIR: ${EXPORT_OUTPUT_DIR:-/tmp/tmp-exports}
      TZ: Asia/Ho_Chi_Minh
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      REDIS_CACHE_ENABLED: ${REDIS_CACHE_ENABLED:-true}
    ports:
      - "3042:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - mta-net

  mta-be-portal:
    image: ghcr.io/songphantech/mta-be-portal:latest
    pull_policy: never
    container_name: mta-be-portal
    restart: unless-stopped
    env_file:
      - .env
      - .env.be-portal
    environment:
      TZ: Asia/Ho_Chi_Minh
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-40}
      PORT: "3000"
      DATA_SYNC_IMPORT_DIR: /data/mta-import
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      REDIS_CACHE_ENABLED: ${REDIS_CACHE_ENABLED:-true}
      REDIS_TTL_SESSION: ${REDIS_TTL_SESSION:-60}
      REDIS_TTL_STUDENT: ${REDIS_TTL_STUDENT:-60}
      REDIS_TTL_CLASSES_INFO: ${REDIS_TTL_CLASSES_INFO:-5}
      REDIS_RATE_LIMIT_ENABLED: ${REDIS_RATE_LIMIT_ENABLED:-true}
      REDIS_RL_REGISTER_MAX: ${REDIS_RL_REGISTER_MAX:-20}
      REDIS_RL_REGISTER_WINDOW: ${REDIS_RL_REGISTER_WINDOW:-60}
      REDIS_RL_UNREGISTER_MAX: ${REDIS_RL_UNREGISTER_MAX:-20}
      REDIS_RL_UNREGISTER_WINDOW: ${REDIS_RL_UNREGISTER_WINDOW:-60}
      REDIS_RL_READ_MAX: ${REDIS_RL_READ_MAX:-120}
      REDIS_RL_READ_WINDOW: ${REDIS_RL_READ_WINDOW:-60}
    ports:
      - "3044:3000"
    cpus: ${PORTAL_CPU_LIMIT:-2}
    mem_limit: ${PORTAL_MEM_LIMIT:-2g}
    volumes:
      - mta-import-data:/data/mta-import
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - mta-net

  # Worker import JSON đồng bộ (Kafka data_sync_import_queue) — cùng image be-portal
  mta-be-portal-data-sync-worker:
    image: ghcr.io/songphantech/mta-be-portal:latest
    pull_policy: never
    container_name: mta-be-portal-data-sync-worker
    restart: unless-stopped
    command: ["bun", "worker-data-sync.js"]
    env_file:
      - .env
      - .env.be-portal
    environment:
      TZ: Asia/Ho_Chi_Minh
      DATABASE_POOL_SIZE: ${DATA_SYNC_WORKER_POOL_SIZE:-10}
      DATA_SYNC_IMPORT_DIR: /data/mta-import
      DATA_SYNC_WORKER_ENABLED: "true"
      CLASS_REGISTER_WORKER_ENABLED: "false"
      CLASS_REGISTER_EVENTS_WORKER_ENABLED: "false"
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
    cpus: ${DATA_SYNC_WORKER_CPU_LIMIT:-1}
    mem_limit: ${DATA_SYNC_WORKER_MEM_LIMIT:-2g}
    volumes:
      - mta-import-data:/data/mta-import
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - mta-net

  mta-be-ql-dao-tao-shared:
    image: ghcr.io/songphantech/mta-be-ql-dao-tao-shared:latest
    pull_policy: never
    container_name: mta-be-ql-dao-tao-shared
    restart: unless-stopped
    env_file:
      - .env
      - .env.be-ql-dao-tao-shared
    environment:
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "3045:3000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - mta-net

volumes:
  postgres_data:
  minio_data:
  mta-import-data:

networks:
  mta-net:
    name: mta-net
    driver: bridge
